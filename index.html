<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>iPhone 17 Pro — configure &amp; order</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg-1:#EEF2FF;
  --bg-2:#F5F7FF;
  --bg-3:#E9F2FF;

  --ink:#111318;
  --muted:#737A8C;

  --card:rgba(255,255,255,.78);
  --card-strong:rgba(255,255,255,.92);
  --line:rgba(255,255,255,.75);
  --hair:rgba(23,38,92,.10);

  --blue:#2D5BFF;
  --blue-deep:#1B3FD8;
  --violet:#7C6BFF;

  --shadow-soft:0 30px 60px -34px rgba(36,56,120,.45), 0 2px 10px rgba(36,56,120,.06);
  --shadow-lift:0 18px 34px -18px rgba(36,56,120,.55);

  --r-card:30px;
  --r-ctl:16px;

  --ease:cubic-bezier(.22,1,.36,1);
  --ease-out:cubic-bezier(.2,.8,.3,1);
  --ease-in:cubic-bezier(.55,.06,.9,.45);
  --spring:cubic-bezier(.34,1.56,.64,1);

  /* shipping box */
  --bw:clamp(158px, 46vw, 206px);
  --bh:clamp(118px, 20vh, 150px);
  --bh:clamp(118px, 20svh, 150px);
  --bd:clamp(96px, 28vw, 124px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 700px at 12% -10%, #FFFFFF 0%, rgba(255,255,255,0) 60%),
    radial-gradient(900px 600px at 110% 12%, var(--bg-3) 0%, rgba(233,242,255,0) 62%),
    linear-gradient(168deg, var(--bg-2) 0%, var(--bg-1) 58%, #E6ECFF 100%);
  display:grid;place-items:center;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ============================================================
   DEVICE SHELL — mobile first, centred demo on desktop
   ============================================================ */
.device{
  position:relative;
  width:min(100vw,430px);
  height:min(100vh,932px);      /* fallback for browsers without svh */
  height:min(100svh,932px);
  display:flex;flex-direction:column;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(620px 380px at 78% 6%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 62%),
    radial-gradient(520px 420px at 6% 86%, rgba(197,214,255,.55) 0%, rgba(197,214,255,0) 66%),
    linear-gradient(172deg, #F7F9FF 0%, var(--bg-1) 52%, #E4EBFF 100%);
}
@media (min-width:540px) and (min-height:720px){
  .device{
    height:min(94vh,900px);
    height:min(94svh,900px);
    border-radius:46px;
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 60px 120px -48px rgba(28,44,110,.55), 0 0 0 10px rgba(255,255,255,.5);
  }
}

/* ---------- app bar ---------- */
.appbar{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top, 0px)) 18px 10px;
  z-index:4;
}
.iconbtn{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
  background:rgba(255,255,255,.6);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 6px 14px -10px rgba(36,56,120,.7);
  cursor:pointer;transition:transform .18s var(--ease-out), background .2s;
}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round}
.mark{width:22px;height:22px;fill:#0B0D12}
.bagdot{
  position:absolute;margin:-14px 0 0 14px;width:7px;height:7px;border-radius:50%;
  background:var(--blue);box-shadow:0 0 0 2px rgba(255,255,255,.9);
  opacity:0;transform:scale(.4);transition:opacity .3s, transform .45s var(--spring);
}
.bagdot.on{opacity:1;transform:scale(1)}

/* ============================================================
   STAGE + SCENES
   ============================================================ */
.stage{position:relative;flex:1 1 auto;min-height:0;z-index:2}
.scene{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:4px 18px 20px;
  opacity:0;pointer-events:none;
  transform:translateY(14px) scale(.985);
  transition:opacity .42s var(--ease), transform .55s var(--ease);
}
.scene.on{opacity:1;pointer-events:auto;transform:none}
.scene.out{opacity:0;pointer-events:none;transform:translateY(-18px) scale(.975)}

/* ---------- the morphing product card ---------- */
.cardwrap{position:relative;flex:1 1 auto;min-height:0;display:flex}
.card{
  position:relative;flex:1;min-height:0;width:100%;
  border-radius:var(--r-card);
  background:var(--card);
  border:1px solid var(--line);
  backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);
  box-shadow:var(--shadow-soft);
  overflow:hidden;cursor:pointer;
  transition:box-shadow .5s var(--ease), transform .5s var(--ease);
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 34%);
}
.card::after{
  content:"";position:absolute;left:50%;top:30%;width:78%;height:46%;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(closest-side, rgba(124,107,255,.16), rgba(124,107,255,0) 70%);
  opacity:.9;
}
.card.is-config{cursor:default}
.card:not(.is-config):active{transform:scale(.985)}

.vp{position:absolute;left:0;right:0;top:4%;height:58%;transition:transform .72s var(--ease)}
.vp img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center;
  filter:drop-shadow(0 22px 26px rgba(30,44,100,.18));
  will-change:transform,opacity;
}
.vp.missing::after{
  content:"Missing " attr(data-file);
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:64%;padding:16px 12px;border-radius:18px;text-align:center;
  border:1.5px dashed rgba(45,91,255,.45);color:var(--muted);
  font-size:12px;line-height:1.5;background:rgba(255,255,255,.6);
}
.peek{
  position:absolute;top:12%;height:44%;width:36%;object-fit:contain;
  opacity:.14;filter:blur(1.2px);pointer-events:none;
  transition:opacity .45s var(--ease);
}
.peek.l{left:-20%}
.peek.r{right:-20%}

.meta{
  position:absolute;left:0;right:0;top:65%;text-align:center;
  transition:transform .72s var(--ease);
}
.pname{font-size:clamp(21px,5.2vw,25px);font-weight:650;letter-spacing:-.4px;line-height:1.16}
.ptag{margin-top:5px;font-size:13px;line-height:1.2;color:var(--muted);letter-spacing:.1px}

/* ---------- configurator inside the same card ---------- */
.config{
  position:absolute;left:0;right:0;top:38%;bottom:0;
  padding:0 20px 20px;
  display:flex;flex-direction:column;justify-content:flex-end;
  gap:clamp(10px,2.1svh,17px);
  opacity:0;transform:translateY(16px);pointer-events:none;
  transition:opacity .42s var(--ease), transform .6s var(--ease);
}
.card.is-config .vp{transform:translateY(var(--vpShift,-60px)) scale(.55)}
.card.is-config .meta{transform:translateY(var(--metaShift,-150px))}
.card.is-config .peek{opacity:0}
.ptag{transition:opacity .3s var(--ease)}
.card.is-config .ptag{opacity:0}
.card.is-config .config{opacity:1;transform:none;pointer-events:auto}

.glabel{display:block;font-size:12.5px;line-height:1;color:var(--muted);margin:0 0 10px;letter-spacing:.1px}
/* Colour dots, memory chips and SIM tiles all sit on the same column grid,
   so the three rows read as one block instead of three ragged lines. */
.row{display:grid;grid-template-columns:repeat(var(--n,4),1fr);align-items:center;justify-items:center;gap:9px}

.sw{
  width:30px;height:30px;border-radius:50%;border:1px solid rgba(23,38,92,.16);
  cursor:pointer;position:relative;background:#ccc;
  box-shadow:inset 0 -4px 8px rgba(0,0,0,.18), inset 0 3px 6px rgba(255,255,255,.5);
  transition:transform .4s var(--spring), box-shadow .3s;
}
.sw::after{
  content:"";position:absolute;inset:-5px;border-radius:50%;
  border:1.6px solid var(--blue);opacity:0;transform:scale(.78);
  transition:opacity .3s var(--ease), transform .45s var(--spring);
}
.sw.sel{transform:scale(1.06)}
.sw.sel::after{opacity:1;transform:scale(1)}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.chip{
  height:clamp(38px,5.4svh,44px);border-radius:var(--r-ctl);
  border:1px solid var(--hair);background:rgba(255,255,255,.62);
  font:inherit;font-size:13.5px;font-weight:550;color:var(--ink);cursor:pointer;
  transition:transform .42s var(--spring), border-color .25s, box-shadow .35s var(--ease), background .25s;
}
.chip.sel{
  border-color:rgba(45,91,255,.55);background:#fff;
  box-shadow:0 10px 20px -12px rgba(36,56,120,.75), inset 0 0 0 1px rgba(45,91,255,.25);
  transform:scale(1.045);
}
.chip:active{transform:scale(.97)}

.sims{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.sim{
  width:100%;height:clamp(32px,4.6svh,36px);border-radius:12px;border:1px solid rgba(23,38,92,.12);
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .42s var(--spring), box-shadow .35s var(--ease);
}
.sim i{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:17px;height:14px;border-radius:3px;
  background:rgba(255,255,255,.9);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.sim i::before,.sim i::after{
  content:"";position:absolute;left:2px;right:2px;height:1px;background:rgba(0,0,0,.16);
}
.sim i::before{top:4.5px}
.sim i::after{top:8.5px}
.sim.sel{transform:scale(1.07);box-shadow:0 0 0 2px #fff, 0 0 0 3.6px currentColor, 0 10px 18px -12px rgba(36,56,120,.8)}

/* ---------- carousel arrows ---------- */
.nav{
  position:absolute;top:44%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:50%;z-index:5;
  display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.76);border:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 10px 22px -14px rgba(36,56,120,.9);
  transition:transform .3s var(--ease-out), opacity .35s var(--ease), background .2s;
}
.nav svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav.prev{left:-7px}
.nav.next{right:-7px}
.nav:active{transform:translateY(-50%) scale(.88)}
.nav.hit{animation:navhit .4s var(--ease)}
@keyframes navhit{40%{transform:translateY(-50%) scale(.86)}100%{transform:translateY(-50%) scale(1)}}
.cardwrap.is-config .nav{opacity:0;pointer-events:none;transform:translateY(-50%) scale(.8)}

/* ---------- pill CTA ---------- */
.foot{
  flex:0 0 auto;padding-top:14px;position:relative;z-index:8;
  opacity:0;transform:translateY(12px);pointer-events:none;
  transition:opacity .42s var(--ease), transform .55s var(--ease);
}
.foot.on{opacity:1;transform:none;pointer-events:auto}
.cta{
  position:relative;z-index:1;touch-action:manipulation;user-select:none;
  width:100%;height:clamp(48px,6.4svh,54px);border:0;border-radius:999px;
  font:inherit;font-size:16px;font-weight:600;letter-spacing:.1px;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#3C6BFF 0%, var(--blue) 46%, var(--blue-deep) 100%);
  box-shadow:0 16px 30px -14px rgba(27,63,216,.85), inset 0 1px 0 rgba(255,255,255,.34);
  transition:transform .32s var(--spring), box-shadow .3s, filter .2s;
}
.cta:active,.cta.pressed{transform:scale(.962);box-shadow:0 8px 18px -12px rgba(27,63,216,.9)}

/* ---------- size selection ---------- */
.sizecard{
  flex:1;min-height:0;border-radius:var(--r-card);
  background:var(--card);border:1px solid var(--line);
  backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);
  box-shadow:var(--shadow-soft);
  display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,3svh,26px);
  padding:clamp(16px,3svh,26px) 16px;
}
.sizecard h2{font-size:19px;font-weight:600;letter-spacing:-.2px;text-align:center}
.sizes{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.size{
  flex:1 1 0;min-width:0;border:1px solid transparent;background:transparent;
  border-radius:22px;padding:12px 4px 13px;cursor:pointer;font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:transform .5s var(--ease), background .32s, border-color .32s, box-shadow .45s var(--ease);
}
.size img{height:auto;object-fit:contain;filter:drop-shadow(0 14px 16px rgba(30,44,100,.18));transition:transform .5s var(--ease)}
.size span{font-size:13px;color:var(--muted);transition:color .3s}
.size.sel{
  background:rgba(255,255,255,.8);border-color:rgba(45,91,255,.35);
  box-shadow:var(--shadow-lift);transform:translateY(-9px);
}
.size.sel span{color:var(--ink);font-weight:600}
.size.sel img{transform:scale(1.04)}

/* ============================================================
   PACKAGING — CSS 3D box
   ============================================================ */
#sPack{justify-content:center;align-items:center}
.packstage{position:relative;width:100%;flex:1;display:grid;place-items:center}
.boxwrap{transition:transform .7s var(--ease)}
.packstage.settled .boxwrap{transform:translateY(-20%) scale(.82)}

.boxwrap{position:relative;perspective:800px;perspective-origin:50% 42%;display:grid;place-items:center}
.boxlift{
  position:relative;transform-style:preserve-3d;
  width:var(--bw);height:var(--bh);
  opacity:0;transform:translateY(34px) scale(.84);
  transition:opacity .5s var(--ease), transform .62s var(--spring);
}
.boxlift.in{opacity:1;transform:none}
.boxlift.bump{animation:bump .42s var(--ease-out)}
@keyframes bump{
  0%{transform:translateY(0) scaleY(1)}
  32%{transform:translateY(5px) scaleY(.935)}
  64%{transform:translateY(0) scaleY(1.028)}
  100%{transform:translateY(0) scaleY(1)}
}
.box{
  position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateX(17deg) rotateY(-24deg);
}
.face{position:absolute;left:50%;top:50%;transform-style:preserve-3d;border:1px solid rgba(255,255,255,.55)}
.face.front{width:var(--bw);height:var(--bh);transform:translate(-50%,-50%) translateZ(calc(var(--bd)/2));
  background:linear-gradient(168deg,#FDFDFF 0%,#EDF1FA 62%,#E2E8F6 100%)}
.face.back{width:var(--bw);height:var(--bh);transform:translate(-50%,-50%) rotateY(180deg) translateZ(calc(var(--bd)/2));
  background:linear-gradient(168deg,#E7ECF7 0%,#DBE2F1 100%)}
.face.right{width:var(--bd);height:var(--bh);transform:translate(-50%,-50%) rotateY(90deg) translateZ(calc(var(--bw)/2));
  background:linear-gradient(168deg,#EDF1FA 0%,#DFE5F3 100%)}
.face.left{width:var(--bd);height:var(--bh);transform:translate(-50%,-50%) rotateY(-90deg) translateZ(calc(var(--bw)/2));
  background:linear-gradient(168deg,#E9EEF9 0%,#D9E1F1 100%)}
.face.bottom{width:var(--bw);height:var(--bd);transform:translate(-50%,-50%) rotateX(-90deg) translateZ(calc(var(--bh)/2));
  background:linear-gradient(180deg,#CBD5EC 0%,#B9C6E4 100%)}
.face.front::after{
  content:"";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:26px;height:26px;border-radius:8px;
  background:rgba(17,19,24,.14);
}
.flap{
  position:absolute;left:0;width:100%;bottom:100%;
  transform-origin:50% 100%;transform:rotateX(-30deg);
  background:linear-gradient(180deg,#F6F8FD 0%,#E4EAF7 100%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 6px 14px -10px rgba(30,46,100,.6);
  transition:transform .4s var(--ease);
}
.front .flap,.back .flap{height:calc(var(--bd)/2 - 3px)}
.left .flap,.right .flap{height:calc(var(--bw)/2 - 3px)}
.left .flap{transform:rotateX(-24deg)}
.right .flap{transform:rotateX(-24deg)}
.box.closed .left .flap{transform:rotateX(90deg);transition-delay:0ms}
.box.closed .right .flap{transform:rotateX(90deg);transition-delay:70ms}
.box.closed .back .flap{transform:rotateX(89.2deg);transition-delay:140ms}
.box.closed .front .flap{transform:rotateX(88.4deg);transition-delay:210ms}

#dropPhone{
  position:absolute;left:50%;top:50%;
  height:calc(var(--bh) * .86);width:auto;
  transform:translate(-50%,-50%) translateY(-340px);
  object-fit:contain;opacity:0;
  filter:drop-shadow(0 20px 22px rgba(30,44,100,.3));
}
.boxshadow{
  position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);
  width:calc(var(--bw) * 1.12);height:34px;border-radius:50%;
  background:radial-gradient(closest-side, rgba(43,62,130,.30), rgba(43,62,130,0) 72%);
  opacity:0;transition:opacity .5s var(--ease);
}
.boxshadow.in{opacity:1}

/* ---------- success ---------- */
.done{
  position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:16px;
  padding-top:30%;
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease);
}
.done.on{opacity:1;pointer-events:auto}
.checkwrap{position:relative;display:grid;place-items:center}
.pulse{
  position:absolute;width:104px;height:104px;border-radius:50%;
  background:radial-gradient(closest-side, rgba(34,197,94,.30), rgba(34,197,94,0) 70%);
  transform:scale(.2);opacity:0;
}
.done.on .pulse{animation:pulse 1.1s var(--ease-out) forwards}
.done.on .pulse.two{animation-delay:.22s}
@keyframes pulse{0%{transform:scale(.2);opacity:.9}100%{transform:scale(2.7);opacity:0}}
.check{
  width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,#34D27B 0%,#1FA85C 100%);
  box-shadow:0 22px 40px -18px rgba(22,133,73,.9), inset 0 1px 0 rgba(255,255,255,.4);
  transform:scale(0);
}
.done.on .check{animation:pop .62s var(--spring) forwards}
@keyframes pop{0%{transform:scale(0)}55%{transform:scale(1.15)}76%{transform:scale(.96)}100%{transform:scale(1)}}
.check svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:48;stroke-dashoffset:48}
.done.on .check svg{animation:draw .38s var(--ease-out) .26s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.donetext{text-align:center;opacity:0}
.done.on .donetext{animation:fadeup .5s var(--ease) .34s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.donetext h2{font-size:19px;font-weight:600;letter-spacing:-.2px}
.donetext p{font-size:13.5px;color:var(--muted);margin-top:5px}
.again{
  margin-top:4px;border:1px solid var(--line);background:rgba(255,255,255,.7);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:999px;padding:10px 20px;font:inherit;font-size:13.5px;color:var(--ink);
  cursor:pointer;box-shadow:0 10px 20px -14px rgba(36,56,120,.8);
  transition:transform .3s var(--spring);
}
.again:active{transform:scale(.95)}

/* ============================================================
   OVERLAYS
   ============================================================ */
#confetti{position:absolute;inset:0;z-index:40;pointer-events:none}
.taplayer{position:absolute;inset:0;z-index:50;pointer-events:none}
.ring{
  position:absolute;width:46px;height:46px;border-radius:50%;
  border:1.6px solid rgba(93,101,255,.85);
  transform:translate(-50%,-50%) scale(.35);opacity:0;
  animation:ring .62s var(--ease-out) forwards;
}
@keyframes ring{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
  22%{opacity:.95}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.55)}
}

/* boot entrance */
.stage{opacity:0;transform:translateY(18px) scale(.97);
  transition:opacity .6s var(--ease), transform .8s var(--ease)}
body.boot .stage{opacity:1;transform:none}

:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:12px}

@media (prefers-reduced-motion:reduce){
  .peek{display:none}
}
</style>
</head>
<body>

<div class="device" id="device">

  <!-- ============ app bar ============ -->
  <div class="appbar">
    <button class="iconbtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h11"/></svg>
    </button>

    <svg class="mark" viewBox="0 0 24 24" aria-label="Store" role="img">
      <path d="M12 1.8 22.2 12 12 22.2 1.8 12z" opacity=".92"/>
      <circle cx="12" cy="12" r="3.1" fill="#fff" opacity=".9"/>
    </svg>

    <button class="iconbtn" aria-label="Bag" style="position:relative">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5.5 8h13l-1 12h-11z"/><path d="M8.8 8V6.4a3.2 3.2 0 0 1 6.4 0V8"/>
      </svg>
      <i class="bagdot" id="bagdot"></i>

  <!-- ============ stage ============ -->
  <main class="stage" id="stage">

    <!-- SCENE 1/2/3 — carousel that morphs into the configurator -->

      <div class="cardwrap" id="cardwrap">

            <div class="pname" id="pname">iPhone 17</div>
            <div class="ptag" id="ptag">From $799</div>

          <div class="config" id="config">
            <div>
              <span class="glabel">Color</span>

            </div>
            <div>
              <span class="glabel">Memory</span>

        </button>

    <!-- SCENE 4 — size selection -->

      <div class="sizecard">
        <h2>Choose a size</h2>
        <div class="sizes" id="sizes"></div>
      </div>
      <div class="foot on">
        <button class="cta" id="ctaSize">Continue</button>
      </div>

    <!-- SCENE 6/7/8/9 — packaging + success -->
    <section class="scene" id="sPack">
      <div class="packstage">
        <div class="boxwrap">

  </main>

  <canvas id="confetti"></canvas>
  <div class="taplayer" id="taplayer"></div>
</div>

<script>
"use strict";

/* If anything ever throws, say so on screen instead of failing silently. */
window.addEventListener("error", e => {
  if (document.getElementById("errbox")) return;
  const n = document.createElement("div");
  n.id = "errbox";
  n.style.cssText = "position:absolute;left:12px;right:12px;bottom:12px;z-index:99;padding:12px 14px;"
    + "border-radius:16px;background:rgba(255,255,255,.94);border:1px solid rgba(214,64,64,.4);"
    + "color:#8A1F1F;font:13px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;";
  n.textContent = "Script error: " + (e.message || e.type);
  (document.getElementById("device") || document.body).appendChild(n);
});

/* ============================================================
   1. PRODUCT DATA  —  edit filenames here, nowhere else
   ============================================================ */
/* Images are embedded at the bottom of this file, so index.html works on its
   own. Set USE_FILES = true to load ./assets/<key>.png from disk instead. */
const USE_FILES = false;

const PRODUCTS = [
  {
    id: "iphone16Pro",
    name: "iPhone 16 Pro",
    price: "From $899",
    colors: [
      { id:"black", label:"Black Titanium", hex:"#4A4A4C", key:"iphone-16-pro-black" }
    ]
  },
  {
    id: "iphone17",
    name: "iPhone 17",
    price: "From $799",
    colors: [
      { id:"pink", label:"Pink", hex:"#EE86BE", key:"iphone-17-pink" },
      { id:"teal", label:"Teal",  hex:"#9EC7C6", key:"iphone-17-teal" }
    ]
  },
  {
    id: "iphone17Pro",
    name: "iPhone 17 Pro",
    price: "From $1,099",
    colors: [
      { id:"orange", label:"Cosmic Orange", hex:"#F0793A", key:"iphone-17-pro-orange" },
      { id:"blue",   label:"Deep Blue",     hex:"#3B414E", key:"iphone-17-pro-blue" },
      { id:"white",  label:"Silver",        hex:"#E8E8E6", key:"iphone-17-pro-white" }
    ]
  },
  {
    id: "iphone18ProMax",
    name: "iPhone 18 Pro Max",
    price: "From $1,299",
    colors: [
      { id:"black",  label:"Black",   hex:"#313134", key:"iphone-18-pro-max-black" },
      { id:"sky",    label:"Sky",     hex:"#96B5DB", key:"iphone-18-pro-max-sky" },
      { id:"purple", label:"Purple",  hex:"#7A4E7E", key:"iphone-18-pro-max-purple" },
      { id:"red",    label:"Red",     hex:"#A62734", key:"iphone-18-pro-max-red" }
    ]
  }
];

/* Carousel starts here; the demo swipes right twice, landing on the last model. */
const START_INDEX = 1;

const MEMORY = ["256GB", "512GB", "1TB"];
const SIMS = [
  { id:"esim",   hex:"#2FBF71" },
  { id:"dual",   hex:"#EFC03B" },
  { id:"nano",   hex:"#E4614F" },
  { id:"travel", hex:"#3BB6E0" }
];
const SIZES = [
  { id:"mini", label:"Mini", w:"60%" },
  { id:"midi", label:"Midi", w:"80%" },
  { id:"max",  label:"Max",  w:"100%" }
];

/* ============================================================
   2. STATE
   ============================================================ */
const STAGES = ["PRODUCT_CAROUSEL","CONFIGURATOR","SIZE_SELECTION","PACKAGING","SUCCESS"];
const state = {
  stage: "PRODUCT_CAROUSEL",
  product: START_INDEX,
  color: 0,
  memory: 1,
  sim: 0,
  size: 1,
  auto: true,
  lockUntil: 0           // timestamp; a transition can never deadlock the UI
};

const REDUCED = (() => {
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch (e) { return false; }
})();
const EASE = "cubic-bezier(.22,1,.36,1)";
const $ = id => document.getElementById(id);

const device = $("device"), stage = $("stage"), taplayer = $("taplayer");
const card = $("card"), cardwrap = $("cardwrap"), vp = $("vp"), hero = $("hero");
const peekL = $("peekL"), peekR = $("peekR"), pname = $("pname"), ptag = $("ptag");
const swColor = $("swColor"), swMem = $("swMem"), swSim = $("swSim");
const navPrev = $("navPrev"), navNext = $("navNext");
const sMain = $("sMain"), sSize = $("sSize"), sPack = $("sPack");
const footMain = $("footMain"), ctaConfig = $("ctaConfig"), ctaSize = $("ctaSize");
const sizesEl = $("sizes"), box = $("box"), boxlift = $("boxlift"), boxshadow = $("boxshadow");
const dropPhone = $("dropPhone"), done = $("done"), doneSub = $("doneSub"), bagdot = $("bagdot");

const srcOf  = c => USE_FILES ? "./assets/" + c.key + ".png" : (ASSETS[c.key] || "");
const product = () => PRODUCTS[state.product];
const colour  = () => product().colors[state.color];

/* ============================================================
   3. TIMERS  —  demo timers die on manual input, sequence timers don't
   ============================================================ */
let demoTimers = [], seqTimers = [];
const demo = (ms, fn) => { demoTimers.push(setTimeout(fn, ms)); };
const seq  = (ms, fn) => { seqTimers.push(setTimeout(fn, ms)); };

function stopAuto(){
  if (!state.auto) return;
  state.auto = false;
  demoTimers.forEach(clearTimeout);
  demoTimers = [];
}
function clearAllTimers(){
  demoTimers.forEach(clearTimeout); seqTimers.forEach(clearTimeout);
  demoTimers = []; seqTimers = [];
}

/* ============================================================
   4. IMAGE HELPERS (graceful fallback if a file is missing)
   ============================================================ */
function guard(img){
  img.addEventListener("error", () => {
    const p = img.parentElement;
    if (p && p.classList.contains("vp")){
      p.classList.add("missing");
      p.setAttribute("data-file", (img.getAttribute("src")||"").split("/").pop());
    }
    img.style.visibility = "hidden";
  });
  img.addEventListener("load", () => {
    img.style.visibility = "";
    const p = img.parentElement;
    if (p && p.classList.contains("vp")){ p.classList.remove("missing"); }
  });
}
[hero, dropPhone].forEach(guard);

/* ============================================================
   5. TAP RING (auto-demo feedback only)
   ============================================================ */
function ringAt(el){
  if (!el) return;
  const r = el.getBoundingClientRect(), d = device.getBoundingClientRect();
  const n = document.createElement("span");
  n.className = "ring";
  n.style.left = (r.left + r.width/2 - d.left) + "px";
  n.style.top  = (r.top  + r.height/2 - d.top) + "px";
  taplayer.appendChild(n);
  n.addEventListener("animationend", () => n.remove());
}
function press(btn){
  btn.classList.add("pressed");
  setTimeout(() => btn.classList.remove("pressed"), 150);
}

/* ============================================================
   6. CARD GEOMETRY  (transform-only morph carousel -> configurator)
   ============================================================ */
function measure(){
  const h = card.clientHeight || 1;
  card.style.setProperty("--vpShift",   (-0.12 * h).toFixed(1) + "px");
  card.style.setProperty("--metaShift", (-0.30 * h).toFixed(1) + "px");
}
window.addEventListener("resize", measure);

/* ============================================================
   7. SCENE 1 — CAROUSEL
   ============================================================ */
function swapHero(src, dir){
  const ghost = hero.cloneNode(false);
  ghost.id = "";
  vp.appendChild(ghost);
  hero.src = src;

  const slide = dir !== 0;
  const dx = dir > 0 ? -58 : 58;

  ghost.animate(
    [{ transform:"translateX(0) scale(1)", opacity:1 },
     { transform:`translateX(${slide?dx:0}%) scale(${slide?.90:.96})`, opacity:0 }],
    { duration: slide?400:290, easing:EASE, fill:"forwards" }
  ).onfinish = () => ghost.remove();

  hero.animate(
    [{ transform:`translateX(${slide?-dx:0}%) scale(${slide?.90:1.04})`, opacity:0 },
     { transform:"translateX(0) scale(1)", opacity:1 }],
    { duration: slide?450:320, easing:EASE }
  );
}

function renderPeeks(){
  const n = PRODUCTS.length;
  peekL.src = srcOf(PRODUCTS[(state.product - 1 + n) % n].colors[0]);
  peekR.src = srcOf(PRODUCTS[(state.product + 1) % n].colors[0]);
}

function renderMeta(animated){
  pname.textContent = product().name;
  ptag.textContent  = product().price;
  if (animated){
    $("meta").animate(
      [{ opacity:0, transform:"translateY(9px)" }, { opacity:1, transform:"translateY(0)" }],
      { duration:360, easing:EASE }
    );
  }
}

function goTo(index, dir){
  if (state.stage !== "PRODUCT_CAROUSEL") return;
  const n = PRODUCTS.length;
  const next = (index + n) % n;
  if (next === state.product) return;
  state.product = next;
  state.color = 0;
  swapHero(srcOf(colour()), dir);
  renderMeta(true);
  renderPeeks();
}
const nextProduct = () => goTo(state.product + 1, 1);
const prevProduct = () => goTo(state.product - 1, -1);

/* ============================================================
   8. SCENE 2/3 — CONFIGURATOR
   ============================================================ */
function buildConfig(){
  swColor.innerHTML = "";
  swColor.style.setProperty("--n", product().colors.length);
  product().colors.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "sw" + (i === state.color ? " sel" : "");
    b.style.background = c.hex;
    b.title = c.label;
    b.setAttribute("aria-label", c.label);
    b.addEventListener("click", () => setColor(i));
    swColor.appendChild(b);
  });

  swMem.innerHTML = "";
  MEMORY.forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "chip" + (i === state.memory ? " sel" : "");
    b.textContent = m;
    b.addEventListener("click", () => setMemory(i));
    swMem.appendChild(b);
  });

  swSim.innerHTML = "";
  SIMS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "sim" + (i === state.sim ? " sel" : "");
    b.style.background = s.hex;
    b.style.color = s.hex;
    b.setAttribute("aria-label", "SIM option " + (i+1));
    b.innerHTML = "<i></i>";
    b.addEventListener("click", () => setSim(i));
    swSim.appendChild(b);
  });
}

function setColor(i){
  if (i === state.color) return;
  state.color = i;
  [...swColor.children].forEach((el, k) => el.classList.toggle("sel", k === i));
  swapHero(srcOf(colour()), 0);
}
function setMemory(i){
  state.memory = i;
  [...swMem.children].forEach((el, k) => el.classList.toggle("sel", k === i));
  swMem.children[i].animate(
    [{transform:"scale(1.045)"},{transform:"scale(.97)"},{transform:"scale(1.075)"},{transform:"scale(1.045)"}],
    {duration:380, easing:EASE}
  );
}
function setSim(i){
  state.sim = i;
  [...swSim.children].forEach((el, k) => el.classList.toggle("sel", k === i));
  swSim.children[i].animate(
    [{transform:"scale(1.07)"},{transform:"scale(.95)"},{transform:"scale(1.1)"},{transform:"scale(1.07)"}],
    {duration:380, easing:EASE}
  );
}

function selectProduct(){
  if (state.stage !== "PRODUCT_CAROUSEL") return;
  state.stage = "CONFIGURATOR";
  state.color = 0;
  buildConfig();
  measure();
  card.classList.add("is-config");
  cardwrap.classList.add("is-config");
  footMain.classList.add("on");
  card.animate(
    [{ transform:"scale(.985)" }, { transform:"scale(1)" }],
    { duration:520, easing:EASE }
  );
}

/* ============================================================
   9. SCENE 4 — SIZE SELECTION
   ============================================================ */
function buildSizes(){
  sizesEl.innerHTML = "";
  SIZES.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "size" + (i === state.size ? " sel" : "");
    const img = document.createElement("img");
    img.src = srcOf(colour());
    img.alt = product().name + " " + s.label;
    img.style.width = s.w;
    guard(img);
    const label = document.createElement("span");
    label.textContent = s.label;
    b.append(img, label);
    b.addEventListener("click", () => setSize(i));
    sizesEl.appendChild(b);
  });
}
function setSize(i){
  state.size = i;
  [...sizesEl.children].forEach((el, k) => el.classList.toggle("sel", k === i));
}

function toSizeSelection(){
  if (state.stage !== "CONFIGURATOR" || Date.now() < state.lockUntil) return;
  state.lockUntil = Date.now() + 320;
  state.stage = "SIZE_SELECTION";
  bagdot.classList.add("on");
  buildSizes();
  sMain.classList.add("out");
  sMain.classList.remove("on");
  seq(260, () => sSize.classList.add("on"));
}

/* ============================================================
   10. SCENES 5–9 — PACKAGING, DROP, CLOSE, CONFETTI, CHECK
   ============================================================ */
function toPackaging(){
  if (state.stage !== "SIZE_SELECTION" || Date.now() < state.lockUntil) return;
  state.lockUntil = Date.now() + 2400;
  state.stage = "PACKAGING";

  dropPhone.src = srcOf(colour());
  doneSub.textContent = `${product().name} · ${MEMORY[state.memory]} · ${SIZES[state.size].label}`;

  // clear the stage
  sSize.classList.add("out");
  sSize.classList.remove("on");

  // box enters
  seq(340, () => {
    sPack.classList.add("on");
    boxlift.classList.add("in");
    boxshadow.classList.add("in");
  });

  // phone falls in
  seq(900, dropIn);

  // flaps close
  seq(1480, () => box.classList.add("closed"));

  // success
  seq(2080, succeed);
}

function dropIn(){
  const end = "translate(-50%,-50%) translateY(6px) rotateZ(0deg)";
  dropPhone.style.opacity = "1";
  dropPhone.animate(
    [
      { transform:"translate(-50%,-50%) translateY(-340px) rotateZ(-4deg)", opacity:0, offset:0 },
      { transform:"translate(-50%,-50%) translateY(-250px) rotateZ(-3deg)", opacity:1, offset:.18 },
      { transform:end, opacity:1, offset:1 }
    ],
    { duration: REDUCED ? 260 : 520, easing:"cubic-bezier(.55,.06,.9,.45)", fill:"forwards" }
  );
  seq(REDUCED ? 270 : 530, () => {
    boxlift.classList.add("bump");
    seq(460, () => boxlift.classList.remove("bump"));
  });
}

function succeed(){
  state.stage = "SUCCESS";
  state.lockUntil = 0;
  document.querySelector(".packstage").classList.add("settled");
  done.classList.add("on");
  burst();
}

/* ============================================================
   11. CONFETTI — canvas, no dependencies
   ============================================================ */
const cvs = $("confetti"), ctx = cvs.getContext("2d");
let parts = [], raf = 0, t0 = 0;
const COLORS = ["#F59E0B","#3B82F6","#22C55E","#FACC15","#8B5CF6","#EC4899"];
const rnd = (a,b) => a + Math.random() * (b - a);

function sizeCanvas(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = device.clientWidth, h = device.clientHeight;
  cvs.width = w * dpr; cvs.height = h * dpr;
  cvs.style.width = w + "px"; cvs.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", sizeCanvas);

function burst(){
  if (REDUCED) return;
  sizeCanvas();
  const w = device.clientWidth, h = device.clientHeight;
  parts = [];
  for (let i = 0; i < 86; i++){
    parts.push({
      x: w/2 + rnd(-60,60),
      y: h*0.5 + rnd(-26,18),
      vx: rnd(-3.4,3.4),
      vy: rnd(-9.4,-4.2),
      w: rnd(5,10),
      h: rnd(7,14),
      rot: rnd(0, Math.PI*2),
      vr: rnd(-0.22,0.22),
      drift: rnd(0.004,0.015),
      phase: rnd(0, Math.PI*2),
      round: Math.random() < 0.3,
      c: COLORS[i % COLORS.length]
    });
  }
  cancelAnimationFrame(raf);
  t0 = performance.now();
  raf = requestAnimationFrame(tick);
}

function tick(now){
  const t = now - t0;
  const w = device.clientWidth, h = device.clientHeight;
  ctx.clearRect(0, 0, w, h);
  let alive = 0;

  for (const p of parts){
    p.vy += 0.30;                    // gravity
    p.vx += Math.sin(t * p.drift + p.phase) * 0.05;   // horizontal drift
    p.vx *= 0.994;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;

    const fade = t > 2600 ? Math.max(0, 1 - (t - 2600) / 1400) : 1;
    if (p.y < h + 40 && fade > 0) alive++;

    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    if (p.round){
      ctx.beginPath();
      ctx.ellipse(0, 0, p.w/2, p.h/2.4, 0, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h * Math.abs(Math.cos(p.rot * .9)));
    }
    ctx.restore();
  }

  if (alive > 0 && t < 4600){
    raf = requestAnimationFrame(tick);
  } else {
    ctx.clearRect(0, 0, w, h);
  }
}

/* ============================================================
   12. AUTOMATIC DEMO  (matches the reference timeline)
   ============================================================ */
function runDemo(){
  if (!state.auto) return;

  demo(760,  () => { ringAt(navNext); navNext.classList.add("hit"); });
  demo(800,  () => { navNext.classList.remove("hit"); nextProduct(); });          // -> iPhone Air

  demo(1460, () => { ringAt(navNext); navNext.classList.add("hit"); });
  demo(1500, () => { navNext.classList.remove("hit"); nextProduct(); });          // -> iPhone 17 Pro

  demo(2180, () => ringAt(card));
  demo(2240, selectProduct);                                                      // configurator

  demo(3180, () => ringAt(swColor.children[1]));
  demo(3220, () => setColor(1));                                                  // colour change

  demo(3580, () => ringAt(swMem.children[2]));
  demo(3620, () => setMemory(2));                                                 // 1TB

  demo(4080, () => ringAt(swSim.children[3]));
  demo(4120, () => setSim(3));                                                    // SIM

  demo(4760, () => { ringAt(ctaConfig); press(ctaConfig); });
  demo(4840, toSizeSelection);

  demo(6000, () => { ringAt(sizesEl.children[0]); setSize(0); });
  demo(6440, () => { ringAt(sizesEl.children[1]); setSize(1); });
  demo(6860, () => { ringAt(sizesEl.children[2]); setSize(2); });                  // Max

  demo(7020, () => { ringAt(ctaSize); press(ctaSize); });
  demo(7100, toPackaging);                                                        // packaging -> success
}

/* ============================================================
   13. MANUAL INTERACTION — always live, kills the auto demo
   ============================================================ */
device.addEventListener("pointerdown", e => { if (e.isTrusted) stopAuto(); }, true);
device.addEventListener("keydown", e => { if (e.isTrusted) stopAuto(); }, true);

navNext.addEventListener("click", nextProduct);
navPrev.addEventListener("click", prevProduct);
card.addEventListener("click", e => {
  if (state.stage === "PRODUCT_CAROUSEL" && !e.target.closest("button")) selectProduct();
});
/* Continue always does the sensible next thing for the current stage, and
   listens on click AND pointerup so a swallowed click can't strand anyone. */
function onContinue(){
  if (state.stage === "PRODUCT_CAROUSEL"){ selectProduct(); return; }
  if (state.stage === "CONFIGURATOR"){ toSizeSelection(); return; }
  if (state.stage === "SIZE_SELECTION"){ toPackaging(); return; }
}
let lastFire = 0;
function fire(fn){
  const t = Date.now();
  if (t - lastFire < 450) return;   // de-duplicate pointerup + click
  lastFire = t;
  fn();
}
[ctaConfig, ctaSize].forEach(btn => {
  btn.addEventListener("click",     () => fire(onContinue));
  btn.addEventListener("pointerup", () => fire(onContinue));
});
$("again").addEventListener("click", restart);

document.addEventListener("keydown", e => {
  if (state.stage !== "PRODUCT_CAROUSEL") return;
  if (e.key === "ArrowRight") nextProduct();
  if (e.key === "ArrowLeft")  prevProduct();
});

/* swipe the card */
let sx = 0, sy = 0, tracking = false;
card.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; tracking = true; });
card.addEventListener("pointerup", e => {
  if (!tracking) return;
  tracking = false;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? nextProduct : prevProduct)();
});

/* ============================================================
   14. RESET / BOOT
   ============================================================ */
function restart(){
  clearAllTimers();
  cancelAnimationFrame(raf);
  ctx.clearRect(0, 0, device.clientWidth, device.clientHeight);

  Object.assign(state, {
    stage:"PRODUCT_CAROUSEL", product:START_INDEX, color:0, memory:1, sim:0, size:1, auto:true, lockUntil:0
  });

  done.classList.remove("on");
  document.querySelector(".packstage").classList.remove("settled");
  box.classList.remove("closed");
  boxlift.classList.remove("in","bump");
  boxshadow.classList.remove("in");
  dropPhone.style.opacity = "0";
  dropPhone.getAnimations().forEach(a => a.cancel());
  bagdot.classList.remove("on");

  sPack.classList.remove("on","out");
  sSize.classList.remove("on","out");
  sMain.classList.remove("out");
  sMain.classList.add("on");
  card.classList.remove("is-config");
  cardwrap.classList.remove("is-config");
  footMain.classList.remove("on");

  hero.src = srcOf(colour());
  renderMeta(false);
  renderPeeks();
  measure();
  runDemo();
}

function boot(){
  hero.src = srcOf(colour());
  renderMeta(false);
  renderPeeks();
  buildConfig();
  buildSizes();
  sizeCanvas();
  measure();
  requestAnimationFrame(() => {
    document.body.classList.add("boot");
    measure();
    runDemo();
  });
}
